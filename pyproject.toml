[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-news-poly"
version = "0.1.0"
description = "BTC technical-analysis + news bot that trades Polymarket BTC markets."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.1",
    "numpy>=1.26",
    "vaderSentiment>=3.3.2",
    "feedparser>=6.0.11",
    "PyYAML>=6.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "py-clob-client>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
btc-poly = "btc_news_poly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
